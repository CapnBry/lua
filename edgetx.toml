[package]
name = "expresslrs"
description = "ExpressLRS Lua scripts and widgets for EdgeTX"
license = "GPL-3.0"
source_dir = "src"

[[libraries]]
name = "ELRS"
path = "SCRIPTS/ELRS"

[[tools]]
name = "ExpressLRS"
path = "SCRIPTS/TOOLS/ExpressLRS"

[[widgets]]
name = "ELRSTelemetry"
path = "WIDGETS/ELRSTelemetry"
depends = ["ELRS"]

[[widgets]]
name = "ELRSVTXAdmin"
path = "WIDGETS/ELRSVTXAdmin"
depends = ["ELRS"]
exclude = ["presets.txt"]
