package:
  name: expresslrs
  description: ExpressLRS Lua scripts and widgets for EdgeTX
  license: GPL-3.0
  source_dir: src
  min_edgetx_version: "2.12.0"

libraries:
  - name: ELRS
    path: SCRIPTS/ELRS

tools:
  - name: ExpressLRS
    path: SCRIPTS/TOOLS/ExpressLRS

widgets:
  - name: ELRSTelemetry
    path: WIDGETS/ELRSTelemetry
    depends:
      - ELRS

  - name: ELRSVTXAdmin
    path: WIDGETS/ELRSVTXAdmin
    depends:
      - ELRS
    exclude:
      - presets.txt
