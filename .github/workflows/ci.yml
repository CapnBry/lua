name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint and Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: cargo-stylua-${{ runner.os }}

      - name: Install tools
        run: make install-tools

      - name: Run checks
        run: make check
